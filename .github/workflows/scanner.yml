name: NSE IPO Breakout Scanner

on:
  schedule:
    - cron: '45 3 * * 1-5'
    - cron: '30 5 * * 1-5'
    - cron: '0  7 * * 1-5'
    - cron: '30 8 * * 1-5'

  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install yfinance pandas pandas_ta requests

      - name: Run NSE IPO Scanner
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python nse_ipo_scanner.py
