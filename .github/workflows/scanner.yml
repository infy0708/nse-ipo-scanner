name: NSE IPO Breakout Scanner

on:
  schedule:
    # IST 09:30 = UTC 04:00  (market open)
    - cron: '0 4 * * 1-5'
    # IST 11:30 = UTC 06:00
    - cron: '0 6 * * 1-5'
    # IST 13:30 = UTC 08:00
    - cron: '0 8 * * 1-5'
    # IST 15:15 = UTC 09:45
    - cron: '45 9 * * 1-5'
  workflow_dispatch:   # allows manual trigger from Actions tab

permissions:
  contents: write      # needed to commit results.json back to repo

jobs:
  scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --break-system-packages yfinance pandas requests schedule

      - name: Run NSE IPO Scanner
        run: python nse_ipo_scanner.py

      - name: Save results to repo
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"
          git add results.json
          git diff --staged --quiet || git commit -m "Update scan results $(date +'%d-%b-%Y %H:%M')"
          git push
